name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show Environment
        run: 'echo "Selected environment: ${{ inputs.environment }}"'

      - name: Deployment Message
        run: 'echo "Deployment triggered for ${{ inputs.environment }}"'